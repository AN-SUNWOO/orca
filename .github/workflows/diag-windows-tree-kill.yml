name: Diagnostic - Windows tree kill (temporary, not for merge)
on:
  push:
    branches: [diag/windows-taskkill-background-completion]
permissions:
  contents: read
jobs:
  windows-tree-kill:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          persist-native-cache: 'false'
      - name: Process-host unit tests and Windows boundaries touched by the change
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/packages/process-host
          src/shared/__tests__/process-host
          src/main/ipc/preflight-runnable-local-cli.test.ts
          config/scripts/orcad-windows-prebuild-cache.test.mjs
      - name: Late taskkill under CPU load (1/3)
        env:
          ORCA_WINDOWS_TREE_KILL_LOAD: '1'
        run: pnpm exec vitest run --config config/vitest.config.ts src/shared/__tests__/process-host/windows-tree-kill-late-taskkill.win32.test.ts
      - name: Late taskkill under CPU load (2/3)
        env:
          ORCA_WINDOWS_TREE_KILL_LOAD: '1'
        run: pnpm exec vitest run --config config/vitest.config.ts src/shared/__tests__/process-host/windows-tree-kill-late-taskkill.win32.test.ts
      - name: Late taskkill under CPU load (3/3)
        env:
          ORCA_WINDOWS_TREE_KILL_LOAD: '1'
        run: pnpm exec vitest run --config config/vitest.config.ts src/shared/__tests__/process-host/windows-tree-kill-late-taskkill.win32.test.ts
